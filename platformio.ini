[platformio]
default_envs = esp32s3
data_dir = build/store
[riscrte]
version = 0.1.14

[env:esp32s3]
platform = espressif32@6.13.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
  platformio/tool-esptoolpy@2.41100.260830
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wl,--wrap=nvs_flash_init
  -DBOARD_HAS_PSRAM
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DCONFIG_ELF_LOADER=1
  -DCONFIG_ELF_DYNAMIC_LOAD_SHARED_OBJECT=1
  -DCONFIG_ELF_LOADER_LOAD_PSRAM=1
  -DCONFIG_ELF_LOADER_BUS_ADDRESS_MIRROR=1
  -DCONFIG_ELF_LOADER_CACHE_OFFSET=1
  -DCONFIG_ELF_LOADER_LIBC_SYMBOLS=1
  -DCONFIG_ELF_FILE_SYSTEM_BASE_PATH=\"/bootfs\"
  -Isdk/driver
  -Isdk/hardware
  -Isdk/app
extra_scripts = pre:scripts/reproducible_build.py
monitor_speed = 115200

# Lab candidate: application-only at the existing 0x10000 partition. The
# separately linked heartbeat ELF lives as immutable data in a read-only VFS.
# No SPIFFS mount, NVS initialization, partition table or bootloader deployment.
[env:cam-ci]
extends = env:esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
  ${env:esp32s3.build_flags}
  -DRISC_EMBEDDED_BOOTSTORE=1
  -DRISC_TARGET=\"cam-nosd\"
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=1
  -Wl,--wrap=nvs_flash_init
extra_scripts =
  pre:scripts/reproducible_build.py
  pre:scripts/embed_store.py

# Serial-only X4 lab candidate. Hardware facts pinned in docs/X4_HEARTBEAT.md;
# native USB differs from CAM. No display/SD/touch/power driver is embedded.
[env:x4-ci]
extends = env:esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = test/hardware/x4/partitions.csv
custom_boot_board = test/hardware/x4/board.json
build_flags =
  ${env:esp32s3.build_flags}
  -DRISC_EMBEDDED_BOOTSTORE=1
  -DRISC_TARGET=\"x4\"
  -DRISC_BOARD_MARKER=\"RISCRTE_BOARD_ID:xteink-x4-pro\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_RUNNING_CORE=0
  -DARDUINO_EVENT_RUNNING_CORE=0
  -Wl,--wrap=nvs_flash_init
extra_scripts =
  pre:scripts/reproducible_build.py
  pre:scripts/embed_store.py

# Generic 16 MiB flash / octal PSRAM target with native USB diagnostics.
# Same bootfs layout as the baseline; no product drivers or pins are embedded.
[env:esp32s3-16mb-usb]
extends = env:esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
build_flags =
  ${env:esp32s3.build_flags}
  -DRISC_TARGET=\"esp32s3-16mb-usb\"
  -DARDUINO_USB_CDC_ON_BOOT=1
