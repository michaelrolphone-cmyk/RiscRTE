name: Shared SD settings regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'sdk/**'
      - 'test/**'
      - 'scripts/host_compiler_cache.py'
      - '.github/actions/host-cache/**'
      - '.github/workflows/shared-settings.yml'
permissions:
  contents: read
concurrency:
  group: shared-settings-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/host-cache
        with:
          shard: shared-settings
      - name: Scalable settings, path aliases, and real Runtime routing
        run: |
          bash test/run_sd_first_key_value_test.sh
          bash test/run_removable_runtime_test.sh
          bash test/run_scoped_user_volume_test.sh
      - name: Undefined-behavior regressions
        env:
          SANITIZE: '1'
          SANITIZERS: undefined
        run: |
          bash test/run_sd_first_key_value_test.sh
          bash test/run_removable_runtime_test.sh
      - name: Report compiler cache results
        if: always()
        run: ccache --show-stats --verbose
  # integration.yml owns the complete suite for all pull requests.
