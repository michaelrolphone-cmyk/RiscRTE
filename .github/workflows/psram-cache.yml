name: Native PSRAM cache qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      IDF_CCACHE_ENABLE: '0'
      CCACHE_DISABLE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Own immutable source and pinned SDK
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/psram-cache"
          mkdir -p "$root"/receipts
          echo "CACHE_ROOT=$root" >> "$GITHUB_ENV"
          git init -q "$root/source"
          git -C "$root/source" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$root/source" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$root/source" checkout -q --detach FETCH_HEAD
          git -C "$root/source" submodule update --init --recursive --depth=1
          test "$(git -C "$root/source" rev-parse HEAD)" = "$SOURCE_SHA"
          . "$IDF_PATH/export.sh"
          python "$root/source/scripts/native_idf61_ci.py" sources --source "runtime=$root/source@$SOURCE_SHA" --source "sdk=$IDF_PATH@fff9895c82d744c7237be8847347bdd1b07c6643" --output "$root/receipts/source-custody.json"
      - name: Actual cache admission, bounds, geometry and probe controls
        run: |
          set -euo pipefail
          cd "$CACHE_ROOT/source"
          python test/test_resident_worker_dependency_scan.py
          python test/test_psram_cache_target_calls.py
          python test/run_psram_cache.py --output "$CACHE_ROOT/receipts/consumer-normal.json"
          python test/run_psram_cache.py --output "$CACHE_ROOT/receipts/consumer-ubsan.json" --sanitize
      - name: Build exact SDK diagnostic with one compiler job
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py -C "$CACHE_ROOT/source/test/native_psram_cache_target" -B "$CACHE_ROOT/build" -D IDF_TARGET=esp32s3 -D "RISC_SOURCE_SHA=$SOURCE_SHA" -D "SDKCONFIG=$CACHE_ROOT/build/sdkconfig" -D CCACHE_ENABLE=0 reconfigure
          cmake --build "$CACHE_ROOT/build" -- -j1
          python "$CACHE_ROOT/source/scripts/verify_psram_cache_target.py" --runtime "$CACHE_ROOT/source" --sdk "$IDF_PATH" --build "$CACHE_ROOT/build" --output "$CACHE_ROOT/receipts/target.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psram-cache-${{ env.SOURCE_SHA }}
          path: |
            ${{ env.CACHE_ROOT }}/receipts/
            ${{ env.CACHE_ROOT }}/build/native_psram_cache_probe.elf
            ${{ env.CACHE_ROOT }}/build/native_psram_cache_probe.bin
            ${{ env.CACHE_ROOT }}/build/config/sdkconfig.h
          if-no-files-found: error
