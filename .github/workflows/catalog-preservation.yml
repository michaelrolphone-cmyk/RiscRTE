name: Catalog preservation qualification artifacts
on:
  pull_request:
    paths:
      - 'docs/catalog-preservation/**'
      - '.github/workflows/catalog-preservation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/catalog-preservation/**'
      - '.github/workflows/catalog-preservation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures-and-report-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deterministic fixture metadata
        run: python docs/catalog-preservation/1.0.0/fixtures.py --check
      - name: Test report consistency and false-success rejection
        run: python docs/catalog-preservation/1.0.0/test_qualification.py
      - name: Verify pinned contract bytes
        run: python docs/catalog-preservation/1.0.0/verify_baselines.py --repo .
