name: Native Quad SPI
on:
  push:
    branches: [feat/watch-quad-spi]
  pull_request:
    paths: ['sdk/driver/**', 'sdk/hardware/**', 'src/bootstrap/**', 'src/ports/esp32s3/**', 'test/native*', '.github/workflows/quad-spi.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Actual native transport and legacy regressions
        run: |
          bash test/run_native_spi_test.sh
          SANITIZE=1 bash test/run_native_spi_test.sh
          bash test/run_board_test.sh
          bash test/run_watch_test.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile ESP32-S3 Runtime
        run: |
          python -m pip install platformio==6.1.18 pyelftools==0.32
          pio run -e esp32s3-16mb-appdata-iq
      - name: Package exact committed source and native build
        run: |
          git rev-parse HEAD > QUAD_SOURCE.txt
          git archive HEAD | gzip > quad-native-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quad-native-validation
          path: |
            quad-native-source.tar.gz
            QUAD_SOURCE.txt
            .pio/build/esp32s3-16mb-appdata-iq/firmware.elf
            .pio/build/esp32s3-16mb-appdata-iq/firmware.bin
          retention-days: 30
