name: Native ESP-IDF 6.1 migration
on:
  push:
    branches: [work/native-idf-6.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-idf:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify official SDK identity
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = fff9895c82d744c7237be8847347bdd1b07c6643
          xtensa-esp-elf-gcc --version
      - name: Native startup and peripheral contracts
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          apt-get update
          apt-get install -y --no-install-recommends libssl-dev
          python test/test_native_startup.py
          bash test/run_native_i2s_idf6_test.sh
          bash test/run_native_platform_test.sh
          bash test/run_native_sleep_diagnostics_idf6_test.sh
          bash test/run_native_sha256_test.sh
          bash test/run_elf_time32_test.sh
          bash test/run_elf_yield_compat_test.sh
          bash test/native_nvs_shim/run_test.sh
          bash test/run_native_internal_atomics_test.sh
          python test/run_native_settings_startup_entropy_test.py
          bash test/run_native_http_idf6_test.sh
          bash test/run_native_tls_memory_idf6_test.sh
          bash test/run_image_pressure_realloc_test.sh
          bash test/run_provider_queue_native_placement_test.sh
          bash test/run_native_iq_worker_test.sh
          bash test/run_provider_queue_host_test.sh
          bash test/run_provider_queue_retained_fence_test.sh
      - name: Build native candidate with one compiler job
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd idf
          idf.py -D RISC_SOURCE_SHA="$GITHUB_SHA" reconfigure
          cmake --build build -- -j1
      - name: Qualify native target custody and placement
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python test/native_internal_atomics_target_test.py --compile-commands idf/build/compile_commands.json --idf "$IDF_PATH" --output idf/build/qualification/atomics
          python test/native_http_idf6_target_test.py --compile-commands idf/build/compile_commands.json --idf "$IDF_PATH" --output idf/build/qualification/http
          python test/native_failure_idf6_target_test.py --compile-commands idf/build/compile_commands.json --idf "$IDF_PATH" --output idf/build/qualification/failure
          python test/native_iq_idf6_target_test.py --compile-commands idf/build/compile_commands.json --idf "$IDF_PATH" --rom-elf "$ESP_ROM_ELF_DIR/esp32s3_rev0_rom.elf" --output idf/build/qualification/iq
      - name: Reject Arduino runtime linkage
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python test/native_firmware_idf6_test.py --build idf/build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-idf6-candidate-${{ github.sha }}
          path: |
            idf/build/riscrte_native.elf
            idf/build/riscrte_native.bin
            idf/build/riscrte_native.map
            idf/build/project_description.json
            idf/build/config/sdkconfig.json
            idf/build/log/
            idf/build/qualification/
          if-no-files-found: warn
