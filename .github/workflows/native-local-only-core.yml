name: Native LocalOnly Core Policy
on:
  pull_request:
    paths:
      - 'experimental/native_replica/NativeReplicaCore.h'
      - 'experimental/native_replica/NativeBaselineAdmission.h'
      - 'experimental/native_replica/Checked*.h'
      - 'test/native_local_only_checked_test.cpp'
      - 'test/native_import_power_cut_test.cpp'
      - 'test/native_replica_checked_fixture.h'
      - 'test/run_native_local_only_checked_test.sh'
      - 'test/native_local_only_core_test.cpp'
      - 'test/native_replica_core_test.cpp'
      - 'test/run_native_local_only_core_test.sh'
      - 'test/run_native_replica_core_test.sh'
      - 'test/native_settings_backend_test.cpp'
      - 'test/run_native_settings_backend_test.py'
      - 'src/ports/esp32s3/NativeSettings*'
      - 'test/native_settings_local_mount_bridge.*'
      - 'test/native_settings_local_only_port_test.cpp'
      - 'test/run_native_settings_local_only_port_test.py'
      - '.github/workflows/native-local-only-core.yml'
permissions:
  contents: read
jobs:
  core-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['0', '1']
    env:
      SANITIZE: ${{ matrix.sanitize }}
      SANITIZERS: address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Existing external Core regression
        run: timeout 300 bash test/run_native_replica_core_test.sh
      - name: LocalOnly genesis and bounded checkpoint model
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_local_only_core_test.sh
      - name: Existing fresh artifact grammar
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_fresh_init_artifacts_test.sh
      - name: Existing fresh NVS inventory
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_nvs_fresh_sources_test.sh
      - name: Existing legacy NVS inventory and policy validation
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_nvs_legacy_sources_test.sh
      - name: Existing fresh initialization
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_fresh_initialization_test.sh
      - name: Existing imported initialization
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_import_initialization_test.sh
      - name: Existing external import process-death recovery
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_import_power_cut_test.sh
      - name: LocalOnly checked receipt and process-death recovery
        if: ${{ !cancelled() }}
        run: timeout 300 bash test/run_native_local_only_checked_test.sh
  littlefs-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['0', '1']
    env:
      SANITIZE: ${{ matrix.sanitize }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO
          ref: c8004c5c8362b142ebb35a0e1c5d266532a11581
          path: .backend-inputs/x4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 7e91fa4a6819ba45659d9f8975c3e2646122137a
          path: .backend-inputs/reader
          persist-credentials: false
      - name: Prepare existing pinned fixture SDK
        run: |
          python3 .backend-inputs/x4/minimal/scripts/prepare_sdk.py --runtime . --reader .backend-inputs/reader --output .backend-inputs/sdk
          python3 .backend-inputs/x4/minimal/scripts/prepare_sd_wire_fixture.py --output .backend-inputs/sdk
      - name: Real backend and LittleFS external/local policy cases
        env:
          BACKEND_SDK: ${{ github.workspace }}/.backend-inputs/sdk
          BUILD_DIR: ${{ github.workspace }}/.backend-output
        run: timeout 900 python3 test/run_native_settings_backend_test.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-local-only-backend-${{ matrix.sanitize }}
          path: |
            .backend-inputs/sdk/source-hashes.json
            .backend-output/test
          if-no-files-found: warn
  local-only-port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['0', '1']
        fresh: ['0', '1']
    env:
      SANITIZE: ${{ matrix.sanitize }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO
          ref: c8004c5c8362b142ebb35a0e1c5d266532a11581
          path: .backend-inputs/x4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 7e91fa4a6819ba45659d9f8975c3e2646122137a
          path: .backend-inputs/reader
          persist-credentials: false
      - name: Prepare existing pinned fixture SDK
        run: |
          python3 .backend-inputs/x4/minimal/scripts/prepare_sdk.py --runtime . --reader .backend-inputs/reader --output .backend-inputs/sdk
          python3 .backend-inputs/x4/minimal/scripts/prepare_sd_wire_fixture.py --output .backend-inputs/sdk
      - name: Real default-off local-only port
        run: |
          args=()
          if [ "${{ matrix.sanitize }}" = 1 ]; then args+=(--sanitize); fi
          if [ "${{ matrix.fresh }}" = 1 ]; then args+=(--allow-fresh); fi
          timeout 1500 python3 test/run_native_settings_local_only_port_test.py --sdk .backend-inputs/sdk --output .local-port-output "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-local-only-port-${{ matrix.sanitize }}-${{ matrix.fresh }}
          path: .local-port-output/manifest.json
          if-no-files-found: warn
