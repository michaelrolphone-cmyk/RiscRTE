name: Publish complete ESP32-S3 infrastructure binary
on:
  push:
    branches: [release/esp32s3-infrastructure-v1.4.2-direct]
    paths:
      - artifacts/esp32s3-infrastructure-v1.4.2/**
      - scripts/verify_infrastructure_initial_image.py
      - .github/workflows/publish-infrastructure-direct.yml
permissions:
  contents: read
concurrency:
  group: esp32s3-infrastructure-v1.4.2-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Expand complete binary
        run: gzip -d artifacts/esp32s3-infrastructure-v1.4.2/riscrte-esp32s3-infrastructure-v1.4.2-initial.bin.gz
      - name: Verify exact complete image and embedded cohort
        run: |
          python3 scripts/verify_infrastructure_initial_image.py artifacts/esp32s3-infrastructure-v1.4.2
          cd artifacts/esp32s3-infrastructure-v1.4.2
          sha256sum -c SHA256SUMS
      - name: Publish direct binary and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=esp32s3-infrastructure-v1.4.2
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release must be inspected; refusing automatic overwrite.' >&2
            exit 1
          fi
          gh release create "$tag" artifacts/esp32s3-infrastructure-v1.4.2/* --target "$GITHUB_SHA" --title 'ESP32-S3 Infrastructure Agent v1.4.2 — Durable Request Recovery and Enrollment Preservation' --notes-file artifacts/esp32s3-infrastructure-v1.4.2/RELEASE-NOTES.md --prerelease
      - name: Download published assets and verify actual bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir /tmp/published-infrastructure
          gh release download esp32s3-infrastructure-v1.4.2 --dir /tmp/published-infrastructure
          cd /tmp/published-infrastructure
          sha256sum -c SHA256SUMS
