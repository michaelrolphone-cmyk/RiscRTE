name: Publish complete ESP32-S3 infrastructure binary
on:
  push:
    branches: [release/esp32s3-infrastructure-v1.2.4-direct]
    paths:
      - artifacts/esp32s3-infrastructure-v1.2.4/**
      - scripts/verify_infrastructure_initial_image.py
      - .github/workflows/publish-infrastructure-direct.yml
permissions:
  contents: read
concurrency:
  group: esp32s3-infrastructure-v1.2.4-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Expand complete binary
        run: gzip -d artifacts/esp32s3-infrastructure-v1.2.4/riscrte-esp32s3-infrastructure-v1.2.4-initial.bin.gz
      - name: Verify exact complete image and embedded cohort
        run: |
          python3 scripts/verify_infrastructure_initial_image.py artifacts/esp32s3-infrastructure-v1.2.4
          cd artifacts/esp32s3-infrastructure-v1.2.4
          sha256sum -c SHA256SUMS
      - name: Publish direct binary and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=esp32s3-infrastructure-v1.2.4
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release must be inspected; refusing automatic overwrite.' >&2
            exit 1
          fi
          cat > /tmp/infrastructure-release-notes.md <<'NOTES'
          Complete ESP32-S3 infrastructure-agent first-install binary. Download `riscrte-esp32s3-infrastructure-v1.2.4-initial.bin` directly; no extraction, Python, or compilation is needed to obtain the image.

          Target: ESP32-S3, 16 MiB flash, octal PSRAM at80MHz, CPU240MHz. Flash offset0. Includes bootloader, partition table, native runtime, boot-store with app and both providers, mutable-data template and paired-bank metadata. Layout riscrte-paired-appdata-v2 / ABI2.

          FIRST INSTALL ONLY: the full 16 MiB image replaces existing flash contents, including saved Wi-Fi, pairing and data. Configure it through the captive portal after flashing; the existing private pairing file is still valid. This is not a data-preserving update.

          Fixes the failure after Save: v1.2.3 device logs confirm settings commit and station join, followed by ESP 32794 / Mbed TLS 12288. The shared Core HTTPS transport now constructs a trusted path for the services' cross-signed GTS Root R4 chain. The SDK bundle already trusts GTS Root R4; it no longer follows the unnecessary cross-sign to a retired GlobalSign root. Certificate authentication remains required.

          The pinned SDK's disabled cross-signed branch also needed Mbed TLS 4 compatibility and allocator fixes. A digest-checked build transformation removes an obsolete ASN.1 field and uses the same PSRAM-backed allocator as Mbed TLS. Private session time still validates every real certificate in the verified chain; only the exact bundle-generated subject/key anchor skips nonexistent encoded dates. Wrong hostname, invalid signature, missing trust and invalid dates remain rejected. Certificate failure diagnostics now expose depth, flags and candidate errors.

          Fixes a separate Core radio diagnostic overflow: unchanged ApInfo/NetifUp/IpInfo probes no longer enqueue six identical records per worker tick. Status changes, lifecycle events, stalled-call visibility and explicit overflow accounting remain. The bounded history ring is 64 records. The shared 8192-byte USB console fix remains included.

          Verification: actual pinned SDK cryptography and certificate bundle reproduce the old -0x3000 and accept the captured public service chain with zero flags after the fix. Tests reject wrong hostname, expired/future leaf, expired intermediate, invalid signature, untrusted signer, empty real-certificate dates and invalid clock. ASan covers 100 repeated verifications and 99 injected allocation failures with counted cleanup. ASan/UBSan radio tests cover 60000 unchanged edges, transitions, stalled calls, new operations and explicit saturation. Native HTTP lifecycle/parser tests, stage-on/off target compilation and the application integration suite pass (171 requests, 32 maintenance wakes, four reboots).

          Join RiscRTE-Setup (password RiscRTE-Setup). Open http://192.168.4.1/; if Android's sign-in window cannot choose files, stay on the setup network and open that address in Chrome. Choose the same private pairing file and enter Wi-Fi. No Python, extraction, compilation or VSCode changes are required. Application and provider hashes remain the v1.2.3 cohort.

          Hardware status: v1.2.3 setup/save/join are observed. v1.2.4 target build, real certificate regression and complete-image checks pass; live service reconciliation on the physical device remains pending.


          Exact source identities and every component hash are recorded in flash-manifest.json and direct-image.json. Publication does not flash any device.
          NOTES
          gh release create "$tag" artifacts/esp32s3-infrastructure-v1.2.4/* --target "$GITHUB_SHA" --title 'ESP32-S3 Infrastructure Agent v1.2.4 — TLS Certificate Fix' --notes-file /tmp/infrastructure-release-notes.md --prerelease
      - name: Download published assets and verify actual bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir /tmp/published-infrastructure
          gh release download esp32s3-infrastructure-v1.2.4 --dir /tmp/published-infrastructure
          cd /tmp/published-infrastructure
          sha256sum -c SHA256SUMS
