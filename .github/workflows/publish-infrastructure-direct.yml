name: Publish complete ESP32-S3 infrastructure binary
on:
  push:
    branches: [release/esp32s3-infrastructure-v1.2.3-direct]
    paths:
      - artifacts/esp32s3-infrastructure-v1.2.3/**
      - scripts/verify_infrastructure_initial_image.py
      - .github/workflows/publish-infrastructure-direct.yml
permissions:
  contents: read
concurrency:
  group: esp32s3-infrastructure-v1.2.3-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Expand complete binary
        run: gzip -d artifacts/esp32s3-infrastructure-v1.2.3/riscrte-esp32s3-infrastructure-v1.2.3-initial.bin.gz
      - name: Verify exact complete image and embedded cohort
        run: |
          python3 scripts/verify_infrastructure_initial_image.py artifacts/esp32s3-infrastructure-v1.2.3
          cd artifacts/esp32s3-infrastructure-v1.2.3
          sha256sum -c SHA256SUMS
      - name: Publish direct binary and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=esp32s3-infrastructure-v1.2.3
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release must be inspected; refusing automatic overwrite.' >&2
            exit 1
          fi
          cat > /tmp/infrastructure-release-notes.md <<'NOTES'
          Complete ESP32-S3 infrastructure-agent first-install binary. Download `riscrte-esp32s3-infrastructure-v1.2.3-initial.bin` directly; no extraction, Python, or compilation is needed to obtain the image.

          Target: ESP32-S3, 16 MiB flash, octal PSRAM at80MHz, CPU240MHz. Flash offset0. Includes bootloader, partition table, native runtime, boot-store with app and both providers, mutable-data template and paired-bank metadata. Layout riscrte-paired-appdata-v2 / ABI2.

          FIRST INSTALL ONLY: the full 16 MiB image replaces existing flash contents, including identity and data.

          Fixes Save and connect: the parser incorrectly expected 19 bytes for the 20-byte POST request line, returning Use the setup page before attempting Wi-Fi. Request matching now uses exact literal lengths for HTTP/1.0 and HTTP/1.1.

          Corrects test evidence: the bundled SHA header had disabled product test assertions. The wrapper now preserves assertions and every infrastructure suite rejects NDEBUG. The old parser fails with assertions restored; the corrected implementation passes the full portal suite. Earlier affected PASS text was not valid assertion evidence. Core USB logging/radio suites were unaffected.

          Android setup: join RiscRTE-Setup (password RiscRTE-Setup). If the sign-in window cannot choose files, stay connected, open Chrome and enter http://192.168.4.1/. Choose the existing private pairing file and save. Pasting remains available. The page now distinguishes local setup connectivity from router internet and retains input after errors. No Python, extraction, compilation or VSCode changes are required.

          Existing v1.2/v1.2.1/v1.2.2 pairing files remain compatible: only the exact published prior provider cohort is migrated to the new image's revision-3 implementation pins. Mixed/tampered cohorts remain rejected. Credentials, identity and endpoints remain unchanged. New provider definitions are published to Capabilities Service.

          Active ASan/UBSan tests cover exact HTTP framing, CSRF, pairing migration, durable save, retry/reboot and uncertain commits. The actual page script passes file/paste and status tests with DOM/network mocks. The service integration run passes 171 requests, 32 maintenance wakes, four reboots, lost-response recovery and composite dependency execution. Target compilation, complete image and source checks pass. Owner physically confirmed setup AP/page on v1.2.2; v1.2.3 save, station join and live reconciliation still await hardware confirmation.


          Exact source identities and every component hash are recorded in flash-manifest.json and direct-image.json. Publication does not flash any device.
          NOTES
          gh release create "$tag" artifacts/esp32s3-infrastructure-v1.2.3/* --target "$GITHUB_SHA" --title 'ESP32-S3 Infrastructure Agent v1.2.3 — Setup Save Fix' --notes-file /tmp/infrastructure-release-notes.md --prerelease
      - name: Download published assets and verify actual bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir /tmp/published-infrastructure
          gh release download esp32s3-infrastructure-v1.2.3 --dir /tmp/published-infrastructure
          cd /tmp/published-infrastructure
          sha256sum -c SHA256SUMS
