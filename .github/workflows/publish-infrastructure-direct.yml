name: Publish complete ESP32-S3 infrastructure binary
on:
  push:
    branches: [release/esp32s3-infrastructure-v1.2.2-direct]
    paths:
      - artifacts/esp32s3-infrastructure-v1.2.2/**
      - scripts/verify_infrastructure_initial_image.py
      - .github/workflows/publish-infrastructure-direct.yml
permissions:
  contents: read
concurrency:
  group: esp32s3-infrastructure-v1.2.2-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'michaelrolphone-cmyk/RiscRTE'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Expand complete binary
        run: gzip -d artifacts/esp32s3-infrastructure-v1.2.2/riscrte-esp32s3-infrastructure-v1.2.2-initial.bin.gz
      - name: Verify exact complete image and embedded cohort
        run: |
          python3 scripts/verify_infrastructure_initial_image.py artifacts/esp32s3-infrastructure-v1.2.2
          cd artifacts/esp32s3-infrastructure-v1.2.2
          sha256sum -c SHA256SUMS
      - name: Publish direct binary and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=esp32s3-infrastructure-v1.2.2
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Existing release must be inspected; refusing automatic overwrite.' >&2
            exit 1
          fi
          cat > /tmp/infrastructure-release-notes.md <<'NOTES'
          Complete ESP32-S3 infrastructure-agent first-install binary. Download `riscrte-esp32s3-infrastructure-v1.2.2-initial.bin` directly; no extraction, Python, or compilation is needed to obtain the image.

          Target: ESP32-S3, 16 MiB flash, octal PSRAM at80MHz, CPU240MHz. Flash offset0. Includes bootloader, partition table, native runtime, boot-store with app and both providers, mutable-data template and paired-bank metadata. Layout riscrte-paired-appdata-v2 / ABI2.

          FIRST INSTALL ONLY: the full 16 MiB image replaces existing flash contents, including identity and data.

          Fixes the infrastructure board's missing AP permission: the old station-only configuration was rejected by the Core radio gate before setup could broadcast. The generated board and station provider now admit station plus AP. The generic radio permission check remains enforced.

          Fixes shared Core native USB logging: the console previously reported only the 128-byte write budget even with an 8 KiB ring, causing longer status lines to be discarded. All native USB profiles now default to an 8 KiB ring with conservative complete-drain credit accounting, including builds with stage diagnostics disabled. Writes and completion queries remain bounded and zero-timeout.

          After flashing: join RiscRTE-Setup (password RiscRTE-Setup), open http://192.168.4.1/ if needed, enter your Wi-Fi details and select the existing private pairing file. No Python, extraction, compilation or VSCode changes are required. Infra-node bytes and service pairing pins remain unchanged; infra-station is rebuilt with AP permission.

          ASan/UBSan tests pass for the actual Core console and line sink, USB recovery, serial transport, the generated board + actual station provider + real Core radio gate, and portal/recovery/journal/transport/policy/boot health. Native target build and all image/source checks pass. These are concrete software fixes; physical SSID, portal, Wi-Fi join and service reconciliation still await device confirmation. This release is not hardware-qualified.


          Exact source identities and every component hash are recorded in flash-manifest.json and direct-image.json. Publication does not flash any device.
          NOTES
          gh release create "$tag" artifacts/esp32s3-infrastructure-v1.2.2/* --target "$GITHUB_SHA" --title 'ESP32-S3 Infrastructure Agent v1.2.2 — Portal and Core Logging Fix' --notes-file /tmp/infrastructure-release-notes.md --prerelease
      - name: Download published assets and verify actual bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir /tmp/published-infrastructure
          gh release download esp32s3-infrastructure-v1.2.2 --dir /tmp/published-infrastructure
          cd /tmp/published-infrastructure
          sha256sum -c SHA256SUMS
