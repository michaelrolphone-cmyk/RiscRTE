name: Internal runtime storage source
on:
  push:
    branches: [work/unified-default-capabilities]
    paths: ['src/bootstrap/RuntimeFiles.h', 'src/bootstrap/StorageFilesVolumeAdapter.h', 'src/runtime/storage/FileValidation.h', 'src/runtime/storage/PosixFiles.h', 'test/runtime_files_source_test.cpp', 'test/posix_files_provider_test.cpp', 'test/run_runtime_files_source_test.sh', '.github/workflows/runtime-storage-source.yml']
  pull_request:
    paths: ['src/bootstrap/RuntimeFiles.h', 'src/bootstrap/StorageFilesVolumeAdapter.h', 'src/runtime/storage/FileValidation.h', 'src/runtime/storage/PosixFiles.h', 'test/runtime_files_source_test.cpp', 'test/posix_files_provider_test.cpp', 'test/run_runtime_files_source_test.sh', '.github/workflows/runtime-storage-source.yml']
  workflow_dispatch:
jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitize: [0, 1]
    env:
      SANITIZE: ${{ matrix.sanitize }}
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v4
      - run: bash test/run_runtime_files_source_test.sh
      - run: bash test/run_storage_files_adapter_test.sh
