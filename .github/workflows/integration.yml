name: RiscRTE integration
on:
  pull_request:
    # This owns integration for every PR base; shared-settings does not call it again.
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  host-tests:
    name: Host tests (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [normal, asan-1, asan-2, tools]
    runs-on: ubuntu-24.04
    # Every original normal, ASan/UBSan, TSan and variant command is retained.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install esptool==4.11.0 pyelftools==0.32
      - uses: ./.github/actions/host-cache
        with:
          shard: ${{ matrix.shard }}
      - name: Cache and suite correctness guards
        if: matrix.shard == 'tools'
        run: |
          python -m unittest discover -s test -p host_ci_test.py -v
          python -m unittest discover -s test -p native_ci_test.py -v
      - name: Source version guards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_versions.py --base "$BASE_SHA"
          else
            python scripts/check_versions.py
          fi
      - name: Fetch official pinned NVS partition generator (offline tests only)
        if: matrix.shard == 'tools'
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v4.4.7
          sparse-checkout: components/nvs_flash/nvs_partition_generator
          path: build/idf-nvs-source
          persist-credentials: false
      - name: Fetch pinned external clock and drivers (test-only)
        if: matrix.shard == 'normal'
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: aa7b03c15a59aa99b2d60ae20905edbdf62e35e6
          path: build/watch-clock-source
          persist-credentials: false
      - name: Fetch exact LittleFS dependency for offline disk proof
        if: matrix.shard == 'normal'
        uses: actions/checkout@v4
        with:
          repository: joltwallet/esp_littlefs
          ref: 41873c20fb5cdbcf28d7d6cc04e4bcb4a1305317
          submodules: recursive
          path: build/littlefs-source
          persist-credentials: false
      - name: Fetch exact Bluetooth transport provider for burst regression
        if: matrix.shard == 'tools' || matrix.shard == 'asan-2'
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 4966acee548e6cc3997289db206e996ed4c15cda
          path: build/ble-watch-source
          persist-credentials: false
      - name: Fetch exact Bluetooth scanner provider for burst regression
        if: matrix.shard == 'tools' || matrix.shard == 'asan-2'
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: aa5ce0140102bf4d1039e5f208588a6793d06b28
          path: build/ble-driver-source
          persist-credentials: false
      - name: Build initial disk2.1 image and exercise real LittleFS power cuts
        if: matrix.shard == 'normal'
        run: |
          python scripts/app_data_image.py --littlefs-source build/littlefs-source/src/littlefs --output build/appdata-initial
          APP_DATA_INITIAL_IMAGE=build/appdata-initial python test/app_data_image_test.py
          bash test/run_app_data_littlefs_test.sh build/littlefs-source build/appdata-initial/appdata.bin
          SANITIZE=1 bash test/run_app_data_littlefs_test.sh build/littlefs-source build/appdata-initial/appdata.bin
      - uses: actions/upload-artifact@v4
        if: matrix.shard == 'normal'
        with:
          name: riscrte-appdata-initial-image-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/appdata-initial/
          if-no-files-found: error
          retention-days: 14
      - name: Real runtime, external drivers and clock through physical bus model
        if: matrix.shard == 'normal'
        run: bash test/run_clock_integration.sh build/watch-clock-source
      - name: Run independently timed host regression commands
        run: python scripts/run_host_suite.py --shard "${{ matrix.shard }}" --output "build/host-timings-${{ matrix.shard }}.json"
      - name: Report compiler cache results
        if: always()
        run: ccache --show-stats --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-timings-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/host-timings-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
  host:
    # Keep the original required-check name and fail on missing/cancelled shards.
    name: Host integration and version guards
    needs: host-tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every host shard
        env:
          HOST_RESULT: ${{ needs.host-tests.result }}
        run: test "$HOST_RESULT" = success
  target:
    name: Native target-format regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SDK_SOURCE: fff9895c82d744c7237be8847347bdd1b07c6643
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch exact source and frozen SDK header
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends git libssl-dev
          root="$RUNNER_TEMP/native-target-fixtures"
          echo "FIXTURE_ROOT=$root" >> "$GITHUB_ENV"
          git init --quiet "$root"
          git -C "$root" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$root" fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C "$root" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$root/build/watch-clock-sdk"
          git -C "$root/build/watch-clock-sdk" init --quiet
          git -C "$root/build/watch-clock-sdk" remote add origin https://github.com/michaelrolphone-cmyk/RiscRTE-T-Watch-S3.git
          git -C "$root/build/watch-clock-sdk" fetch --no-tags --depth=1 origin aa7b03c15a59aa99b2d60ae20905edbdf62e35e6
          git -C "$root/build/watch-clock-sdk" checkout --quiet FETCH_HEAD -- sdk/app
      - name: Qualify real Xtensa ELFs, loader and image cache
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$SDK_SOURCE"
          cd "$FIXTURE_ROOT"
          python -m pip install pyelftools==0.32
          bash test/run_native_target_fixtures.sh elf
      - name: Qualify real native SPIFFS streaming and compact images
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd "$FIXTURE_ROOT"
          bash test/run_native_target_fixtures.sh spiffs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-target-fixtures-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/native-target-fixtures/build/elf/
            ${{ runner.temp }}/native-target-fixtures/build/native-spiffs-config/
          if-no-files-found: error
          retention-days: 14
