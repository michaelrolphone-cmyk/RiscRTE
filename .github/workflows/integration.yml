name: RiscRTE integration
on:
  pull_request:
    branches: [main, master, integrate/x4-pr35-iq-lifecycle-0146, fix/provider-quiescence-diagnostics, fix/bitbang-probe-startup, fix/gpio-output-readback, feat/declared-file-dispatch, feat/typed-gpio-held-retirement, feat/profile-provisioning-core, feat/minimal-runtime, test/watch-app-handoff, codex/typed-retained-wake, feat/owned-deep-sleep-b1, feat/owned-timer-wake, feat/provider-bound-storage, feat/alarm-i2s-output, feat/platform-radio-station, fix/explicit-kv-namespaces, fix/graph-provider-instance-loading, feat/bounded-kv-v2, feat/app-policy-capacity, feat/provider-key-capacity, feat/owned-wake-set, feat/installed-file-volume, feat/scoped-radio-spi, feat/app-data-volume]
  workflow_dispatch:
  workflow_call:
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  host:
    name: Host integration and version guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install esptool==4.11.0 pyelftools==0.32
      - name: Source version guards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_versions.py --base "$BASE_SHA"
          else
            python scripts/check_versions.py
          fi
      - name: Fetch official pinned NVS partition generator (offline tests only)
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v4.4.7
          sparse-checkout: components/nvs_flash/nvs_partition_generator
          path: build/idf-nvs-source
          persist-credentials: false
      - name: Fetch pinned external clock and drivers (test-only)
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: aa7b03c15a59aa99b2d60ae20905edbdf62e35e6
          path: build/watch-clock-source
          persist-credentials: false
      - name: Fetch exact LittleFS dependency for offline disk proof
        uses: actions/checkout@v4
        with:
          repository: joltwallet/esp_littlefs
          ref: 41873c20fb5cdbcf28d7d6cc04e4bcb4a1305317
          submodules: recursive
          path: build/littlefs-source
          persist-credentials: false
      - name: Build initial disk2.1 image and exercise real LittleFS power cuts
        run: |
          python scripts/app_data_image.py --littlefs-source build/littlefs-source/src/littlefs --output build/appdata-initial
          APP_DATA_INITIAL_IMAGE=build/appdata-initial python test/app_data_image_test.py
          bash test/run_app_data_littlefs_test.sh build/littlefs-source build/appdata-initial/appdata.bin
          SANITIZE=1 bash test/run_app_data_littlefs_test.sh build/littlefs-source build/appdata-initial/appdata.bin
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-appdata-initial-image-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/appdata-initial/
          if-no-files-found: error
          retention-days: 14
      - name: Real runtime, external drivers and clock through physical bus model
        run: bash test/run_clock_integration.sh build/watch-clock-source
      - name: Real host modules, board binding and default-child-default lifecycle
        run: |
          bash test/run_board_test.sh test/fixtures/garden/relay6.json test/fixtures/garden/crowpanel.json test/fixtures/garden/paper.json
          bash test/run_metadata_read_test.sh
          SANITIZE=1 bash test/run_metadata_read_test.sh
          bash test/run_demand_activation_test.sh
          SANITIZE=1 bash test/run_demand_activation_test.sh
          bash test/run_runtime_test.sh
          SANITIZE=1 bash test/run_runtime_test.sh
          bash test/run_app_data_files_test.sh
          SANITIZE=1 bash test/run_app_data_files_test.sh
          bash test/run_app_data_runtime_test.sh
          SANITIZE=1 bash test/run_app_data_runtime_test.sh
          bash test/run_app_data_layout_test.sh
          bash test/run_native_app_data_test.sh
          SANITIZE=1 bash test/run_native_app_data_test.sh
          bash test/run_installed_files_test.sh
          SANITIZE=1 bash test/run_installed_files_test.sh
          bash test/native_tls_async/run_async_fdset.sh
          bash test/native_tls_cleanup/run_checked_cleanup.sh
          bash test/run_http_test.sh
          SANITIZE=1 bash test/run_http_test.sh
          bash test/run_runtime_limits_test.sh
          bash test/run_paired_runtime_memory_test.sh
          SANITIZE=1 bash test/run_paired_runtime_memory_test.sh
          bash test/run_paired_bank_test.sh
          SANITIZE=1 bash test/run_paired_bank_test.sh
          APP_DATA_TEST=1 bash test/run_paired_bank_test.sh
          SANITIZE=1 APP_DATA_TEST=1 bash test/run_paired_bank_test.sh
          bash test/run_cohort_runtime_test.sh
          SANITIZE=1 bash test/run_cohort_runtime_test.sh
          APP_DATA_TEST=1 bash test/run_cohort_runtime_test.sh
          SANITIZE=1 APP_DATA_TEST=1 bash test/run_cohort_runtime_test.sh
          bash test/run_store_audit_test.sh
          SANITIZE=1 bash test/run_store_audit_test.sh
          bash test/run_native_bank_test.sh
          APP_DATA_TEST=1 bash test/run_native_bank_test.sh
          SANITIZE=1 bash test/run_native_bank_test.sh
          bash test/run_provisioning_test.sh
          SANITIZE=1 bash test/run_provisioning_test.sh
          bash test/run_update_runtime_test.sh
          SANITIZE=1 bash test/run_update_runtime_test.sh
          python test/paired_bank_images_test.py -v
          bash test/run_startup_failure_test.sh
          SANITIZE=1 bash test/run_startup_failure_test.sh
          bash test/run_file_open_test.sh
          SANITIZE=1 bash test/run_file_open_test.sh
          bash test/run_held_output_test.sh
          SANITIZE=1 bash test/run_held_output_test.sh
          bash test/run_provider_sync_test.sh
          SANITIZE=1 bash test/run_provider_sync_test.sh
          python test/provision_seed_test.py -v
          python test/provision_profile_test.py -v
          NVS_GENERATOR=build/idf-nvs-source/components/nvs_flash/nvs_partition_generator/nvs_partition_gen.py python test/provision_device_test.py -v
          python test/maintenance_plan_test.py -v
          bash test/run_hci_test.sh
          SANITIZE=1 bash test/run_hci_test.sh
          bash test/run_radio_iq_test.sh
          SANITIZE=1 bash test/run_radio_iq_test.sh
          bash test/run_radio_test.sh
          SANITIZE=1 bash test/run_radio_test.sh
          bash test/run_i2s_test.sh
          SANITIZE=1 bash test/run_i2s_test.sh
          bash test/run_diagnostic_journal_test.sh
          SANITIZE=1 bash test/run_diagnostic_journal_test.sh
          bash test/run_light_sleep_test.sh
          bash test/run_spi_radio_test.sh
          SANITIZE=1 bash test/run_spi_radio_test.sh
          bash test/run_deep_sleep_test.sh
          SANITIZE=1 bash test/run_deep_sleep_test.sh
          bash test/run_key_value_v2_test.sh
          SANITIZE=1 bash test/run_key_value_v2_test.sh
          bash test/run_key_value_multi_test.sh
          SANITIZE=1 bash test/run_key_value_multi_test.sh
          bash test/run_key_value_test.sh
          SANITIZE=1 bash test/run_key_value_test.sh
          bash test/run_bound_key_value_test.sh
          SANITIZE=1 bash test/run_bound_key_value_test.sh
          bash test/run_native_registry_test.sh
          SANITIZE=1 bash test/run_native_registry_test.sh
          bash test/run_provider_module_lease_v2_test.sh
          SANITIZE=1 bash test/run_provider_module_lease_v2_test.sh
          bash test/run_realtime_test.sh
          SANITIZE=1 bash test/run_realtime_test.sh
          bash test/run_retained_wake_test.sh
          SANITIZE=1 bash test/run_retained_wake_test.sh
          bash test/run_retained_app_test.sh
          SANITIZE=1 bash test/run_retained_app_test.sh
          bash test/run_watch_test.sh
          SANITIZE=1 bash test/run_provider_graph_v2_test.sh
          python -m unittest discover -s test -p 'test_*.py' -v
  target:
    name: ESP32-S3 firmware, real ELFs and candidate bundle
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-${{ runner.arch }}-risc-tools-${{ hashFiles('platformio.ini', 'requirements-ci.txt') }}
      - name: Install pinned tools
        run: python -m pip install -r requirements-ci.txt
      - name: Fetch frozen app SDK for Xtensa ABI proof
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: aa7b03c15a59aa99b2d60ae20905edbdf62e35e6
          path: build/watch-clock-sdk
          sparse-checkout: sdk/app
          persist-credentials: false
      - name: Build firmware and real default/child/provider ELFs
        run: |
          pio run -e esp32s3 -j 1
          RADIO_IQ_DISABLED_ELF=.pio/build/esp32s3/firmware.elf python -m unittest discover -s test -p 'test_radio_iq_proof.py' -v
          CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" python test/verify_legacy_runtime_header.py build/watch-clock-sdk/sdk/app/RiscRuntimeV1.h
          python scripts/build_apps.py
          bash test/run_elf_test.sh
          pio run -e esp32s3 -t buildfs -j 1
      - name: Freeze and verify candidate release assets
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/release_assets.py stage --source-sha "$SOURCE_SHA"
          python scripts/release_assets.py verify --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - name: Build and verify generic 16 MiB native-USB runtime
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pio run -e esp32s3-16mb-usb -j 1
          python scripts/usb_candidate.py --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-esp32s3-16mb-usb-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/esp32s3-16mb-usb/
          if-no-files-found: error
          retention-days: 14

      - name: Build paired Runtime with real TLS roots and rollback guard
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pio run -e esp32s3-16mb-paired -j 1
          BOOTLOADER_FILE=.pio/build/esp32s3-16mb-paired/bootloader.bin bash test/run_native_bank_test.sh
          SANITIZE=1 BOOTLOADER_FILE=.pio/build/esp32s3-16mb-paired/bootloader.bin bash test/run_native_bank_test.sh
          python scripts/paired_candidate.py --source-sha "$SOURCE_SHA"
          export MKSPIFFS="$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino"
          python test/provision_seed_test.py -v
          pio run -e esp32s3-16mb-paired -t buildfs -j 1
          python scripts/provision_seed.py --candidate dist/esp32s3-16mb-paired --store .pio/build/esp32s3-16mb-paired/spiffs.bin --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --mkspiffs "$MKSPIFFS" --output dist/esp32s3-16mb-paired/seed --source-sha "$SOURCE_SHA"
          python scripts/provision_seed.py --candidate dist/esp32s3-16mb-paired --store .pio/build/esp32s3-16mb-paired/spiffs.bin --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --mkspiffs "$MKSPIFFS" --output dist/provision-seed-repeat --source-sha "$SOURCE_SHA"
          diff -r dist/esp32s3-16mb-paired/seed dist/provision-seed-repeat
          SEED_DIRECTORY=dist/esp32s3-16mb-paired/seed BOOTLOADER_FILE=.pio/build/esp32s3-16mb-paired/bootloader.bin bash test/run_native_bank_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-esp32s3-16mb-paired-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/esp32s3-16mb-paired/
          if-no-files-found: error
          retention-days: 14

      - name: Build explicit owner maintenance image (no device operation)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pio run -e esp32s3-16mb-maintenance -j 1
          python scripts/maintenance_candidate.py --source-sha "$SOURCE_SHA"
          python test/maintenance_plan_test.py --seed dist/esp32s3-16mb-paired/seed --maintenance dist/owner-maintenance
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-owner-maintenance-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/owner-maintenance/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/download-artifact@v4
        with:
          name: riscrte-appdata-initial-image-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/appdata-initial
      - name: Fetch pinned runtime SPIFFS source for streamed-install proof
        uses: actions/checkout@v4
        with:
          repository: pellepl/spiffs
          ref: 0dbb3f71c5f6fae3747a9d935372773762baf852
          path: build/spiffs-source
          persist-credentials: false
      - name: Build opt-in app-data Runtime and verify separate layout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pio run -e esp32s3-16mb-appdata -j 1
          APP_DATA_TEST=1 BOOTLOADER_FILE=.pio/build/esp32s3-16mb-appdata/bootloader.bin bash test/run_native_bank_test.sh
          SANITIZE=1 APP_DATA_TEST=1 BOOTLOADER_FILE=.pio/build/esp32s3-16mb-appdata/bootloader.bin bash test/run_native_bank_test.sh
          python scripts/paired_candidate.py --app-data --app-data-image build/appdata-initial --source-sha "$SOURCE_SHA"
          pio run -e esp32s3-16mb-appdata -t buildfs -j 1
          python scripts/provision_seed.py --candidate dist/esp32s3-16mb-appdata --store .pio/build/esp32s3-16mb-appdata/spiffs.bin --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --mkspiffs "$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" --output dist/esp32s3-16mb-appdata/seed --source-sha "$SOURCE_SHA"
          SEED_DIRECTORY=dist/esp32s3-16mb-appdata/seed APP_DATA_TEST=1 BOOTLOADER_FILE=.pio/build/esp32s3-16mb-appdata/bootloader.bin bash test/run_native_bank_test.sh
      - name: Real SPIFFS high-fill stream, retry, interruption and error proofs
        run: |
          python test/provisioning_spiffs_fixture.py build/spiffs-fixtures
          for shape in high-fill-83 boundary-3 boundary-128; do
            bash test/run_provisioning_spiffs_test.sh build/spiffs-source "$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3" .pio/build/esp32s3-16mb-appdata/spiffs.bin "build/spiffs-fixtures/$shape" "build/spiffs-result-$shape.bin"
          done
          SANITIZE=1 bash test/run_provisioning_spiffs_test.sh build/spiffs-source "$HOME/.platformio/packages/framework-arduinoespressif32/tools/sdk/esp32s3" .pio/build/esp32s3-16mb-appdata/spiffs.bin build/spiffs-fixtures/high-fill-83 build/spiffs-result-high-fill-83-sanitized.bin
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-esp32s3-16mb-appdata-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/esp32s3-16mb-appdata/
          if-no-files-found: error
          retention-days: 14

      - name: Build opt-in IQ Runtime with mandatory bank reservation proof
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pio run -e esp32s3-16mb-appdata-iq -j 1
          RADIO_IQ_ELF=.pio/build/esp32s3-16mb-appdata-iq/firmware.elf python -m unittest discover -s test -p 'test_radio_iq_proof.py' -v
          python scripts/paired_candidate.py --app-data --radio-iq --app-data-image build/appdata-initial --source-sha "$SOURCE_SHA"
          pio run -e esp32s3-16mb-appdata-iq -t buildfs -j 1
          python scripts/provision_seed.py --candidate dist/esp32s3-16mb-appdata-iq --store .pio/build/esp32s3-16mb-appdata-iq/spiffs.bin --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --mkspiffs "$HOME/.platformio/packages/tool-mkspiffs/mkspiffs_espressif32_arduino" --output dist/esp32s3-16mb-appdata-iq/seed --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: riscrte-esp32s3-16mb-appdata-iq-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/esp32s3-16mb-appdata-iq/
          if-no-files-found: error
          retention-days: 14
