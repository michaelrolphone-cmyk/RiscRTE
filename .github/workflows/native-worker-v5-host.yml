name: Native worker v5 hosted prerequisite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-worker-v5-host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hosted-prerequisite:
    name: Darwin modeled Graph/Module/worker (normal and UBSan)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reproduce the bounded hosted prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cc="$(xcrun --find clang)"
          cxx="$(xcrun --find clang++)"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          openssl_root="$(brew --prefix openssl@3)"
          test -x "$cc"
          test -x "$cxx"
          test -d "$sdk"
          test -f "$openssl_root/lib/libcrypto.dylib"
          output="$RUNNER_TEMP/native-worker-v5-$GITHUB_RUN_ATTEMPT"
          python3 -B test/run_native_worker_v5.py \
            --repo "$GITHUB_WORKSPACE" \
            --cc "$cc" --cxx "$cxx" --sdk "$sdk" \
            --openssl-root "$openssl_root" --output "$output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-worker-v5-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-worker-v5-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

      - name: Reproduce actual Runtime native-owner callers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cc="$(xcrun --find clang)"
          cxx="$(xcrun --find clang++)"
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          openssl_root="$(brew --prefix openssl@3)"
          test -x "$cc"
          test -x "$cxx"
          test -d "$sdk"
          test -f "$openssl_root/lib/libcrypto.dylib"
          output="$RUNNER_TEMP/native-runtime-v5-$GITHUB_RUN_ATTEMPT"
          python3 -B test/run_native_runtime_v5.py \
            --repo "$GITHUB_WORKSPACE" \
            --cc "$cc" --cxx "$cxx" --sdk "$sdk" \
            --openssl-root "$openssl_root" --output "$output"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runtime-v5-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-runtime-v5-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14

# Actual Graph/Module/worker code with explicit modeled kernel, ELF, export and
# physical-retirement boundaries. This job installs nothing, activates no
# target worker and performs no hardware or operational deployment.
