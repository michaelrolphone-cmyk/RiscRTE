name: Display recovery verification tools
on:
  push:
    branches: [fix/display-startup-20261012]
    paths: ['.github/workflows/display-recovery-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 86aab52fb085b0e6dc3c467760395a3571e1fbd1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 06da76aa7f074220b74a282badca0ed0061f1643
          path: watch-runtime-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyelftools==0.32
      - name: Export verification code and exact compiled source
        run: |
          mkdir -p out
          python - <<'PY'
          import elftools,shutil,subprocess,importlib.util
          from pathlib import Path
          shutil.copytree(Path(elftools.__file__).parent,Path('out/elftools'))
          shutil.copytree('vendor/esp-idf-spiffs','out/esp-idf-spiffs')
          subprocess.run(['git','-C','watch-runtime-source','archive','--format=tar.gz','--output='+str(Path('out/watch-runtime-source.tar.gz').resolve()),'06da76aa7f074220b74a282badca0ed0061f1643'],check=True)
          spec=importlib.util.spec_from_file_location('profile','watch-runtime-source/test/run_native_littlefs_profile_test.py')
          profile=importlib.util.module_from_spec(spec);spec.loader.exec_module(profile)
          profile.obtain_inputs(Path('out/pinned-littlefs'),None,None)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: display-recovery-verification-tools
          path: out/
          retention-days: 7
