name: Native worker v5 target prerequisite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-worker-v5-target-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generic-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      SDK_SOURCE: fff9895c82d744c7237be8847347bdd1b07c6643
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      CCACHE_DISABLE: '1'
      IDF_CCACHE_ENABLE: '0'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone exact workflow source as the container owner
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/native-worker-v5-target-$GITHUB_RUN_ATTEMPT"
          test ! -e "$root"
          mkdir -p "$root"
          echo "NATIVE_ROOT=$root" >> "$GITHUB_ENV"
          git init --quiet "$root/source"
          git -C "$root/source" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$root/source" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$root/source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$root/source" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$root/source" submodule update --init --recursive --depth=1
      - name: Verify SDK and run gate parser fixtures
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = "$SDK_SOURCE"
          python "$NATIVE_ROOT/source/test/test_native_worker_v5_target.py" 2>&1 | tee "$NATIVE_ROOT/unit.log"
      - name: Build generic candidate with one compiler job
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          test ! -e "$NATIVE_ROOT/build"
          idf.py -C "$NATIVE_ROOT/source/idf" -B "$NATIVE_ROOT/build" \
            -D "RISC_SOURCE_SHA=$GITHUB_SHA" -D "SDKCONFIG=$NATIVE_ROOT/build/sdkconfig" \
            -D CCACHE_ENABLE=0 -D RISC_CPU_SCOPE_V5_CANDIDATE=ON reconfigure \
            2>&1 | tee "$NATIVE_ROOT/configure.log"
          cmake --build "$NATIVE_ROOT/build" -- -j1 2>&1 | tee "$NATIVE_ROOT/build.log"
      - name: Audit actual objects, archives, linked symbols and protected configuration
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          python "$NATIVE_ROOT/source/scripts/native_worker_v5_target.py" \
            --source-root "$NATIVE_ROOT/source" --source-sha "$GITHUB_SHA" \
            --sdk-root "$IDF_PATH" --build-dir "$NATIVE_ROOT/build" \
            --build-log "$NATIVE_ROOT/build.log" --cc "$(command -v xtensa-esp32s3-elf-gcc)" \
            --output "$NATIVE_ROOT/audit.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-worker-v5-target-${{ github.sha }}
          path: |
            ${{ env.NATIVE_ROOT }}/*.log
            ${{ env.NATIVE_ROOT }}/audit.json
            ${{ env.NATIVE_ROOT }}/build/sdkconfig
            ${{ env.NATIVE_ROOT }}/build/config/sdkconfig.h
            ${{ env.NATIVE_ROOT }}/build/compile_commands.json
            ${{ env.NATIVE_ROOT }}/build/CMakeCache.txt
            ${{ env.NATIVE_ROOT }}/build/esp-idf/runtime/RiscBuildIdentity.h
          if-no-files-found: warn
          retention-days: 14

# Compile/link prerequisite only. No product selection, internal-memory port,
# device connection, firmware publication, runtime activation or deployment.
