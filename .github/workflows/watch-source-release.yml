name: Watch source snapshot
on:
  pull_request:
    paths:
      - '.github/workflows/watch-source-release.yml'
      - 'scripts/publish_watch_source.py'
      - 'tests/test_watch_source_release.py'
      - 'release/watch-1.0.12-source.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch-source-release.yml'
      - 'scripts/publish_watch_source.py'
      - 'tests/test_watch_source_release.py'
      - 'release/watch-1.0.12-source.json'
permissions:
  contents: read
concurrency:
  group: watch-source-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_watch_source_release.py -v
      - run: python scripts/publish_watch_source.py --verify-only
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/publish_watch_source.py
        env:
          GH_TOKEN: ${{ github.token }}
