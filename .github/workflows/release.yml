name: Publish RiscRTE firmware
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: riscrte-firmware-release
  cancel-in-progress: false
jobs:
  integration:
    # The repository currently uses main. A future default master also works.
    # Manual runs on feature/tag refs never get publication authority.
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/integration.yml
  publish:
    name: Verify immutable assets and publish new firmware version
    needs: integration
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned binary verifier
        run: python -m pip install esptool==4.11.0 pyelftools==0.32
      - uses: actions/download-artifact@v4
        with:
          name: riscrte-firmware-${{ github.sha }}
          path: dist/release/
      - name: Reverify downloaded bytes before publication
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/release_assets.py verify --source-sha "$SOURCE_SHA"
      - name: Publish only a new source version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/publish_firmware.py --source-sha "$SOURCE_SHA"
