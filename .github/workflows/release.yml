name: Historical Arduino regression
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: riscrte-legacy-regression
  cancel-in-progress: false
jobs:
  integration:
    # Keep historical integration available without any release authority.
    # Native versions are published only by native-idf61-release.yml.
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/integration.yml
