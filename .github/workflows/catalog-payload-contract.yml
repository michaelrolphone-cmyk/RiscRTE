name: Catalog payload contract
on:
  pull_request:
    paths:
      - 'docs/catalog-payload/**'
      - '.github/workflows/catalog-payload-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/catalog-payload/**'
      - '.github/workflows/catalog-payload-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install -r docs/catalog-payload/1.0.0/requirements.txt
      - name: Validate schemas, deterministic fixtures and adversarial cases
        working-directory: docs/catalog-payload/1.0.0
        run: python test_validate.py
