name: Import tested Quad SPI source
on:
  push:
    branches: [feat/watch-quad-spi]
    paths: ['.github/workflows/import-quad-source.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/watch-quad-spi
      - name: Apply readable source migration
        run: |
          if ! test -f sdk/driver/RiscSpiQuadV1.h; then python3 scripts/apply_quad_port.py; fi
      - name: Validate exact source
        run: |
          bash test/run_native_spi_test.sh
          SANITIZE=1 bash test/run_native_spi_test.sh
          bash test/run_board_test.sh
          bash test/run_watch_test.sh
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk src test
          if ! git diff --cached --quiet; then
            git commit -m 'Add typed raw Quad SPI transport with legacy SPI regression tests'
            git push origin HEAD:feat/watch-quad-spi
          fi
          git rev-parse HEAD > QUAD_SOURCE.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile ESP32-S3 native Runtime
        run: |
          python -m pip install platformio==6.1.18 pyelftools==0.32
          pio run -e esp32s3-16mb-appdata-iq
      - name: Archive exact source and native build
        if: always()
        run: |
          tar --exclude='.git' --exclude='.pio' --exclude='quad-native-source.tar.gz' -czf quad-native-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quad-native-validation
          path: |
            quad-native-source.tar.gz
            QUAD_SOURCE.txt
            .pio/build/esp32s3-16mb-appdata-iq/firmware.elf
            .pio/build/esp32s3-16mb-appdata-iq/firmware.bin
          retention-days: 14
