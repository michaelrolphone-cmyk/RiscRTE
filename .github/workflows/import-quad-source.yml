name: Import tested Quad SPI source
on:
  push:
    branches: [feat/watch-quad-spi]
    paths: ['.github/workflows/import-quad-source.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/watch-quad-spi
      - name: Apply exact locally tested source patch
        env:
          PATCH: >-
            
        run: |
          python3 - <<'PY'
          import base64,gzip,os,hashlib,subprocess
          data=gzip.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(data).hexdigest()=='5d02cb31a09771e0c5c5a9cacb31ab7ad2f25748370246ae6938d5ab2c85f280'
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          PY
      - name: Validate exact source
        run: |
          bash test/run_native_spi_test.sh
          SANITIZE=1 bash test/run_native_spi_test.sh
          bash test/run_board_test.sh
          bash test/run_watch_test.sh
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/QUAD_SPI.md sdk src test
          git commit -m 'Add typed raw Quad SPI transport with legacy SPI regression tests'
          git push origin HEAD:feat/watch-quad-spi
