name: Home Contexts resident broker
on:
  pull_request:
    paths:
      - 'src/bootstrap/**'
      - 'sdk/app/RiscResidentShellV1.h'
      - 'test/resident_shell_test.cpp'
      - 'test/run_resident_shell_test.sh'
      - 'test/optional_app_requirements_test.cpp'
      - 'test/run_optional_app_requirements_test.sh'
      - '.github/workflows/home-contexts-broker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-contexts-broker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitized: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exercise actual Runtime and admitted resident ELFs
        env:
          SANITIZE: ${{ matrix.sanitized }}
          ASAN_OPTIONS: detect_leaks=0
          RESIDENT_SCENARIOS: contexts contexts-busy contexts-retained contexts-invalid normal busy exit policy-host policy-duplicate policy-missing policy-null policy-wake-child callback-retained invalid-callback
        run: |
          set -euo pipefail
          mkdir -p evidence/home-contexts-broker
          git rev-parse HEAD > evidence/home-contexts-broker/source-commit.txt
          git ls-files -z | xargs -0 sha256sum > evidence/home-contexts-broker/source-sha256.txt
          cc --version > evidence/home-contexts-broker/compiler.txt
          python3 - <<'PY'
          from pathlib import Path
          source=Path('test/run_resident_shell_test.sh').read_text()
          old="trap 'rm -rf \"$build\"' EXIT"
          assert source.count(old)==1
          source=source.replace(old,"trap 'cp -a \"$build\" evidence/home-contexts-broker/compiled; rm -rf \"$build\"' EXIT")
          Path('test/.home-contexts-broker.sh').write_text(source)
          PY
          bash -x test/.home-contexts-broker.sh 2>&1 | tee evidence/home-contexts-broker/run.log
      - name: Qualify declaration and owner-grant boundaries without adding live slots
        env:
          SANITIZE: ${{ matrix.sanitized }}
          ASAN_OPTIONS: detect_leaks=0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('test/run_optional_app_requirements_test.sh').read_text()
          old="trap 'rm -rf \"$build\"' EXIT"
          assert source.count(old)==1
          source=source.replace(old,"trap 'cp -a \"$build\" evidence/home-contexts-broker/admission-compiled; rm -rf \"$build\"' EXIT")
          Path('test/.home-contexts-admission.sh').write_text(source)
          PY
          bash -x test/.home-contexts-admission.sh 2>&1 | tee evidence/home-contexts-broker/admission.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-contexts-broker-${{ matrix.sanitized }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/home-contexts-broker
          if-no-files-found: error
