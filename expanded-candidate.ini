[platformio]
extra_configs = platformio.ini

; Successor-only initial provisioning profile. The delivered 0.1.8 profile
; and its 8 MiB image remain immutable. No automatic format or migration.
[env:esp32s3-16mb-waveshare-expanded]
extends = env:esp32s3-16mb-appdata-iq-tcp-entropy
board_build.partitions = partitions-paired-appdata-expanded.csv
build_flags =
  ${env:esp32s3.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DRISC_TARGET=\"esp32s3-16mb-waveshare-expanded\"
  -DRISC_PAIRED_BANKS=1
  -DRISC_PAIRED_APP_DATA=1
  -DRISC_PAIRED_APP_DATA_EXPANDED=1
  -Wl,-u,risc_paired_store_abi
  -Wl,-u,risc_runtime_update_version
  -DRISC_ENABLE_HTTP=1
  -DRISC_ENABLE_SDMMC=1
  -DRISC_ENABLE_USB_PHY=1
  -Wl,-u,risc_usb_phy_resource_enabled
  -Wl,-u,risc_sdmmc_host_abi
  -DRISC_ENABLE_RADIO_IQ=1
  -DRISC_NATIVE_TCP_LISTENER=1
  -Wl,-u,risc_tcp_listener_abi
  -DRISC_NATIVE_ENTROPY=1
  -Wl,-u,risc_entropy_abi
  -DRISC_INSTALLED_APP_CAPACITY=64
  -DRISC_PROVIDER_CAPACITY=40
  -DRISC_APP_POLICY_ROWS=32
  -DRISC_APP_REQUIREMENT_ROWS=32
  -DRISC_STAGE_LOGS=1
  -DRISC_NATIVE_RECOVERY_GPIO=1
  -DRISC_RECOVERY_GPIO_PIN=0
  -DRISC_RECOVERY_GPIO_ACTIVE_HIGH=0

  -DRISC_NATIVE_FILE_SOURCE=1
  -DRISC_NATIVE_APP_DATA_MOUNT=1
  -Wl,--wrap=esp_vfs_register
  -Wl,--wrap=esp_vfs_unregister
  -Wl,--wrap=esp_partition_read
  -Wl,--wrap=esp_partition_write
  -Wl,--wrap=esp_partition_erase_range
  -Wl,--wrap=esp_littlefs_format
  -Wl,--wrap=esp_littlefs_format_partition
  -Wl,-u,risc_file_source_abi
  -Wl,-u,__wrap_esp_littlefs_format
  -Wl,-u,__wrap_esp_littlefs_format_partition
custom_radio_iq_target_identity = esp32s3-16mb-waveshare-expanded
extra_scripts =
  pre:scripts/reproducible_build.py
  post:scripts/radio_iq_build.py

[env:waveshare-t051]
extends = env:esp32s3-16mb-waveshare-expanded
build_flags =
  ${env:esp32s3-16mb-waveshare-expanded.build_flags}
  -include waveshare-settings-profile.h
  -DRISC_NATIVE_SETTINGS_BACKEND=1
  -DRISC_NATIVE_SETTINGS_STARTUP_ENTROPY=1
  -DRISC_NATIVE_SETTINGS_ASSEMBLY=1
  -DRISC_NATIVE_SETTINGS_PSRAM_PAYLOAD=1
  -DRISC_NATIVE_SETTINGS_LIFECYCLE=1
  -DRISC_NATIVE_SETTINGS_WORKER=1
  -DRISC_RUNTIME_ATOMIC_KEY_VALUE=1
  -DRISC_NATIVE_STORAGE_CUSTODY=1
