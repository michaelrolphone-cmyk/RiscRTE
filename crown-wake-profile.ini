[platformio]
extra_configs =
  platformio.ini
  crown-build.ini

# Same Watch/crown target and lifecycle, with existing bounded observers.
# This is an opt-in measurement candidate, not a latency qualification.
[env:crown-wake-profile]
extends = env:crown-recovery-qualification
build_flags =
  ${env:crown-recovery-qualification.build_flags}
  -DRISC_STAGE_LOGS=1
  -DRISC_PERFORMANCE_TRACE=1
